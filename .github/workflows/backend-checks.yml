name: Backend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Synthetic backend regression
        run: PYTHONPATH=backend python3 -m unittest discover -s backend/tests -p 'test_*.py'
      - name: Release failure, rollback and concurrency regression
        run: python3 -m unittest discover -s ops/deploy/tests -p 'test_*.py'

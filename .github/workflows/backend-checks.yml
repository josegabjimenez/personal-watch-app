name: Backend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Synthetic backend regression
        run: PYTHONPATH=backend python3 -m unittest discover -s backend/tests -p 'test_*.py'
      - name: Release failure, rollback and concurrency regression
        run: python3 -m unittest discover -s ops/deploy/tests -p 'test_*.py'
      - name: Match the sealed fixture's Python 3.9 AST representation
        id: legacy_python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
          update-environment: false
      - name: Exact sealed historical grocery package and its offline regression
        env:
          LEGACY_PYTHON: ${{ steps.legacy_python.outputs.python-path }}
        run: |
          git fetch --no-tags --depth=1 origin 1fe67948051f1d25140e13900d51275c498e0770
          "$LEGACY_PYTHON" ops/deploy/build_bundle.py --revision 1fe67948051f1d25140e13900d51275c498e0770 --verify-tests --output "$RUNNER_TEMP/sealed-grocery-review.json"
